services:
  backend:
    build: ./Backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: your local code is mounted into the container
      - ./Backend/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # Hot-reload for React
      - ./Frontend:/app
      - /app/node_modules   # important: keeps node_modules inside the container
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped