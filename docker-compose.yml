services:
  backend:
    build: ./Backend
    container_name: backend
    env_file: ./Backend/.env
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    container_name: frontend
    ports:
      - "3000:80"      # nginx serves the build and proxies /api to backend:8000
    depends_on:
      - backend
    restart: unless-stopped
